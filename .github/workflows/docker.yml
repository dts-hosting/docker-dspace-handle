name: Build and push docker dspace backend image

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  docker:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Dotenv Action
        uses: falti/dotenv-action@v1
        id: dotenv
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::388502511949:role/github_actions
          role-session-name: oidc
      - name: Switch role to dspace (hosting) account
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::590322387960:role/DevOpsRole
          role-session-name: dspace-handle-${{ matrix.arch }}
          role-chaining: true
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: handle
          IMAGE_TAG: "${{ steps.dotenv.outputs.handle_version }}${{ !github.ref_name == 'main' && format('_{0}', github.ref_name) || '' }}-${{ matrix.arch }}"
        run: |
          docker compose build
          docker tag lyrasis/dspace-handle:${{ steps.dotenv.outputs.handle_version }} $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

  push-manifest:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Dotenv Action
        uses: falti/dotenv-action@v1
        id: dotenv
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::388502511949:role/github_actions
          role-session-name: oidc

      - name: Switch role to dspace (hosting) account
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::590322387960:role/DevOpsRole
          role-session-name: dspace-handle-${{ matrix.arch }}
          role-chaining: true

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Push multi-arch manifest to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: handle
          IMAGE_TAG: "${{ steps.dotenv.outputs.handle_version }}${{ !github.ref_name == 'main' && format('_{0}', github.ref_name) || '' }}"
        run: |
          docker buildx imagetools create -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
            $REGISTRY/$REPOSITORY:$IMAGE_TAG-amd64 \
            $REGISTRY/$REPOSITORY:$IMAGE_TAG-arm64
